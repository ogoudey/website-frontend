<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Network Viewer</title>

  <!-- Cytoscape -->
  <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
    }

    #toolbar {
      height: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      border-bottom: 1px solid #ccc;
    }

    #cy {
      width: 100%;
      height: calc(100% - 50px);
      display: block;
    }

    button {
      padding: 6px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <button id="reload-btn">Reload Graph</button>
    <span id="status">Loading...</span>
  </div>

  <div id="cy"></div>

  <script src="/static/app.js"></script>
</body>
</html>
