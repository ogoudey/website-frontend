<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Network Viewer</title>

  <!-- Cytoscape -->
  <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/layout-base@2.0.1/layout-base.js"></script>
  <script src="https://unpkg.com/cose-base@2.2.0/cose-base.js"></script>
  <script src="https://unpkg.com/cytoscape-cose-bilkent@4.1.0/cytoscape-cose-bilkent.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
    }

    #toolbar {
      height: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      border-bottom: 1px solid #ccc;
    }

    #tooltip {
      position: fixed;
      background: #222;
      color: #fff;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      pointer-events: none;
      white-space: pre;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 999;
    }

    #cy {
      width: 100%;
      height: calc(100% - 50px);
      display: block;
    }

    button {
      padding: 6px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <button id="reload-btn">Reload Graph</button>
    <span id="status">Loading...</span>
  </div>
  <div id="tooltip"></div>
  <div id="cy"></div>

  <script src="/static/networkRenderer.js"></script>
</body>
</html>
